interface:
  display_name: "多 Agent 任务拆分"
  short_description: "明确调用后生成具名会话任务卡、模型配置、流程图和提示词"
  default_prompt: "使用 $plan-agent-tasks，根据已确认需求检查缺口，按选定 execution_mode、resource_profile 和 speed_policy 生成计划，交付使用相对路径的任务卡、逐会话准确模型配置、具名会话 Mermaid 流程图和每个会话的简短提示词；未指定时默认 manual + balanced + standard。"
policy:
  allow_implicit_invocation: false
