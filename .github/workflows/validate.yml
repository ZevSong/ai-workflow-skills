name: Validate skills

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate Skill files
        run: python -X utf8 scripts/validate_skills.py
      - name: Test validation and standalone packaging
        run: python -X utf8 -m unittest discover -s tests -v
      - name: Package standalone Skill
        run: python -X utf8 scripts/package_skill.py plan-agent-tasks
